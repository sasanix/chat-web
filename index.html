<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>چت VIP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3670/3670051.png">
</head>
<body>
<div id="app">
    <div id="wallpaper"></div>
    <canvas id="bgCanvas"></canvas>
    <div class="grain"></div>

    <header>
        <div class="user-info">
            <button class="action-btn" onclick="toggleSidebar()">☰</button>
            <div class="avatar" id="avatarEl">?</div>
            <div class="status">
                <h3 id="chatTitle">چت خصوصی</h3>
                <span id="presenceStatus">در حال اتصال...</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="action-btn" id="musicBtn" onclick="toggleMusic()">🔇</button>
            <button class="action-btn" onclick="toggleSearch()">🔍</button>
            <button class="action-btn" onclick="document.getElementById('wallInput').click()">🖼️</button>
            <button class="action-btn" onclick="togglePinScreen()">🔒</button>
            <button class="action-btn" id="themeBtn">🌙</button>
        </div>
    </header>

    <div id="searchBox">
        <input type="text" id="searchInput" placeholder="جستجو در پیام‌ها..." oninput="filterMessages()">
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>لیست مخاطبین</h3>
            <button class="sidebar-close-btn" onclick="toggleSidebar()">✖</button>
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <div id="chatArea">
        <div class="pill">امروز</div>
    </div>

    <div id="typingArea" class="typing-area"></div>

    <button class="scroll-btn" id="scrollBtn" onclick="scrollToBottom()" style="position:absolute;bottom:90px;right:20px;background:var(--header-bg);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;display:flex;justify-content:center;align-items:center;color:var(--text);font-size:1.2rem;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:all .3s;z-index:20">↓</button>

    <footer>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <input type="file" id="wallInput" accept="image/*" style="display:none" onchange="setWallpaper(event)">
        <button class="action-btn footer-btn" id="attachBtn">📎</button>
        <button class="action-btn footer-btn" id="musicSearchBtn" onclick="openMusicSearch()" title="سرچ آهنگ">🎶</button>
        <button class="action-btn footer-btn" id="destructBtn" onclick="toggleDestruct()" title="پیام خودتخریب">💣</button>
        <button class="action-btn footer-btn" id="locBtn" onclick="sendLocation()" title="ارسال موقعیت">📍</button>
        <textarea id="msgInput" placeholder="پیامی بنویسید..." rows="1" autocomplete="off"></textarea>
        <div class="send-btn-container" id="micBtnContainer">
            <button id="sendBtn">🎤</button>
        </div>
    </footer>

    <div id="pinScreen" style="display:none">
        <h2>رمز عبور را وارد کنید</h2>
        <div class="pin-dots" id="pinDots"><div></div><div></div><div></div><div></div></div>
        <div class="pin-pad">
            <button onclick="enterPin('1')">1</button><button onclick="enterPin('2')">2</button><button onclick="enterPin('3')">3</button>
            <button onclick="enterPin('4')">4</button><button onclick="enterPin('5')">5</button><button onclick="enterPin('6')">6</button>
            <button onclick="enterPin('7')">7</button><button onclick="enterPin('8')">8</button><button onclick="enterPin('9')">9</button>
            <button onclick="clearPin()">C</button><button onclick="enterPin('0')">0</button><button onclick="submitPin()">✔</button>
        </div>
    </div>

    <div class="emoji-picker-overlay" id="emojiOverlay" onclick="if(event.target.id==='emojiOverlay')this.style.display='none'">
        <div class="emoji-picker-modal" onclick="event.stopPropagation()">
            <span onclick="setAvatar('🦊')">🦊</span><span onclick="setAvatar('🐼')">🐼</span><span onclick="setAvatar('🚀')">🚀</span><span onclick="setAvatar('👑')">👑</span>
            <span onclick="setAvatar('🎮')">🎮</span><span onclick="setAvatar('🌟')">🌟</span><span onclick="setAvatar('🦁')">🦁</span><span onclick="setAvatar('🐉')">🐉</span>
        </div>
    </div>

    <!-- Modal: Add Contact -->
    <div id="addContactOverlay" class="modal-screen" style="display:none; background:rgba(0,0,0,0.8); z-index:400;">
        <div style="background:var(--app-bg); padding:25px; border-radius:20px; width:90%; max-width:350px; border:1px solid var(--border);">
            <h2 style="text-align:center; margin-bottom:20px;">افزودن مخاطب جدید</h2>
            <div class="input-group">
                <label>شناسه VIP مخاطب (۶ رقم)</label>
                <input id="modalToID" type="number" placeholder="مثلا: 123456" maxlength="6">
            </div>
            <div class="input-group">
                <label>نام مخاطب</label>
                <input id="modalToName" type="text" placeholder="مثلا: نسترن">
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn-large" style="background:var(--input-bg); color:var(--text);" onclick="document.getElementById('addContactOverlay').style.display='none'">انصراف</button>
                <button class="btn-large" onclick="addContactFromModal()">شروع چت</button>
            </div>
        </div>
    </div>

    <div id="musicSearchOverlay" onclick="if(event.target.id==='musicSearchOverlay') closeMusicSearch()">
        <div class="music-modal-content">
            <div class="music-modal-header">
                <h3>🎶 جستجوی آهنگ</h3>
                <button class="action-btn" onclick="closeMusicSearch()" style="font-size:1.5rem">✖</button>
            </div>
            <input type="text" class="music-search-input" id="musicSearchInput" placeholder="اسم آهنگ یا خواننده..." onkeydown="if(event.key==='Enter') doMusicSearch()">
            <div style="margin-bottom:12px">
                <button onclick="doMusicSearch()" style="width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#6366f1,#a855f7);color:white;font-weight:600;cursor:pointer;font-family:inherit;font-size:.95rem">🔍 جستجو</button>
            </div>
            <div id="musicSearchResults">
                <div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:.9rem">اسم آهنگ یا خواننده رو بنویس و جستجو کن 🎵</div>
            </div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
